[package]
name = "bili_add_on"
version = "0.6.0"
edition = "2024"
description = "为视频叠加B站弹幕（danmaku）的命令行工具，支持从B站视频ID自动获取弹幕XML或指定本地弹幕文件"
license = "MIT"
repository = "https://github.com/ordinaryday-my/bili_add_on"
keywords = ["bilibili", "danmaku", "video", "overlay", "cli"]
categories = ["command-line-utilities", "multimedia::video"]

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
image = "0.25.10"
imageproc = { version = "0.27.0", features = ["text"] }
ab_glyph = "0.2"
quick-xml = "0.41.0"
regex = "1.13.0"
reqwest = { version = "0.13.4", features = ["blocking", "gzip", "brotli"] }
flate2 = "1.0"
ffmpeg-next = { version = "8.0", features = ["format", "codec", "software-resampling", "software-scaling"] }
serde_json = "1.0.140"
encoding_rs = "0.8.35"
tempfile = "3"
log = "0.4"
env_logger = "0.11"
dhat = { version = "0.3.3", optional = true }
bit-set = "0.11.1"
crossbeam-channel = "0.5.16"
mimalloc = { version = "0.1.52", default-features = false }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "blit_bench"
harness = false

[profile.release]
lto = true
panic = "abort"
strip = "symbols"
opt-level = 3

[profile.lite-optimize]
inherits = "release"
debug = 1
opt-level = 2
strip = "none"
lto = false
panic = 'unwind'

[features]
dhat-heap = ["dep:dhat"]
ffmpeg-log = []