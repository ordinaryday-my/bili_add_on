name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup FFmpeg dev libraries
        uses: ./.github/actions/setup-ffmpeg

      - name: Check formatting
        run: cargo fmt --check

      - name: Check disk space
        run: df -h .

      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.log

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --lib --bins --tests 2>&1 | tee tests.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ matrix.os }}
          path: |
            clippy.log
            tests.log
          if-no-files-found: ignore
