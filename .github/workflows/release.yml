name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: windows-latest
            target: windows-x86_64
          - os: macos-latest
            target: macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup FFmpeg dev libraries
        uses: ./.github/actions/setup-ffmpeg

      - name: Build release binary
        run: cargo build --release

      - name: Rename binary per platform
        shell: bash
        run: |
          if [ -f target/release/bili_add_on.exe ]; then
            mv target/release/bili_add_on.exe "target/release/bili_add_on-${{ matrix.target }}.exe"
          else
            mv target/release/bili_add_on "target/release/bili_add_on-${{ matrix.target }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bili_add_on-${{ matrix.target }}
          path: target/release/bili_add_on-${{ matrix.target }}*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
